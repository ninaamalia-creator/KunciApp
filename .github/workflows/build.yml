name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o KunciApp.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle -p KunciApp assembleDebug --no-daemon
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp KunciApp/app/build/outputs/apk/debug/app-debug.apk KunciApp.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk KunciApp.apk --title "KunciApp APK" --notes "APK terbaru"
